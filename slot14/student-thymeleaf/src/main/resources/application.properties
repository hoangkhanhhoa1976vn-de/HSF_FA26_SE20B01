spring.application.name=student-thymeleaf
server.port=8080

# ===== SQL Server =====
# encrypt=true la mac dinh cua mssql-jdbc -> can trustServerCertificate=true khi chay local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StudentDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
# update: tu tao/cap nhat bang theo entity, giu nguyen du lieu
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Tat Open Session In View (tranh canh bao khi khoi dong)
spring.jpa.open-in-view=false

# Tat cache de sua HTML khong can restart
spring.thymeleaf.cache=false

# Message cho validation / type mismatch
spring.messages.basename=messages
spring.messages.encoding=UTF-8
